name: Build Windows executable

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: .\build.ps1

      # The .exe is unsigned, so publish a checksum users can verify against instead.
      - name: Checksum
        run: |
          $hash = (Get-FileHash dist\WallpaperExtractor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WallpaperExtractor.exe" | Out-File dist\checksums.txt -Encoding utf8
          Get-Content dist\checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperExtractor
          path: |
            dist/WallpaperExtractor.exe
            dist/checksums.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/WallpaperExtractor.exe dist/checksums.txt --clobber
          } else {
            gh release create $tag dist/WallpaperExtractor.exe dist/checksums.txt --generate-notes
          }
        env:
          GH_TOKEN: ${{ github.token }}
