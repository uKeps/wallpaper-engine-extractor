name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Errors only (undefined names, unused imports...), no style rules. Pinned so a
  # ruff release can't turn the check red on its own.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run ruff==0.12.0 check --select F --target-version py310 --output-format github .

  # The promise in the README: Python 3.10+ and no Pillow/tkinterdnd2 required.
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Test without optional dependencies
        run: |
          python -m unittest discover -s tests
          python -c "import wallpaper_engine_extractor.gui, wallpaper_engine_extractor.wallpaper_browser"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pillow installed so its decoders are tested too; the no-Pillow paths patch it out.
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Build
        run: .\build.ps1

      # The .exe is unsigned, so publish a checksum users can verify against instead.
      - name: Checksum
        run: |
          $hash = (Get-FileHash dist\WallpaperExtractor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WallpaperExtractor.exe" | Out-File dist\checksums.txt -Encoding utf8
          Get-Content dist\checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: WallpaperExtractor
          path: |
            dist/WallpaperExtractor.exe
            dist/checksums.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/WallpaperExtractor.exe dist/checksums.txt --clobber
          } else {
            gh release create $tag dist/WallpaperExtractor.exe dist/checksums.txt --generate-notes
          }
        env:
          GH_TOKEN: ${{ github.token }}
