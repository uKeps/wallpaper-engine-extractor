name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Built in its own job so the OIDC token below is never exposed to the build backend.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  # Trusted publishing: no API token, PyPI trusts this workflow + environment.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
